name: Auto-Update MTProto Proxies

on:
  schedule:
    # Run automatically every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Proxy Scraper
        run: |
          python scraper.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add proxies.txt
          if git diff --staged --quiet; then
            echo "No new proxy changes detected. Skipping commit."
          else
            git commit -m "Auto-update MTProto proxies $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin main
          fi
